# Netlify — deploy do Louve Fácil (PWA Vite)
# Variáveis de ambiente (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY) são
# configuradas no painel do Netlify (Site settings → Environment variables).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: rotas client-side do react-router v7
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache imutável para assets versionados do Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O service worker precisa ser sempre revalidado
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
